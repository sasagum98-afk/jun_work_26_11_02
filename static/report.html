<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급식 이상 보고서</title>
<style>
  @font-face {
    font-family: "Pretendard";
    src: url("vendor/fonts/PretendardVariable.woff2") format("woff2-variations");
    font-weight: 45 920;
  }
  :root { --ink: #1b1d22; --line: #9aa0ab; --g1: #b3262b; --navy: #1f2f5c; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); background: #fff; font-size: 11pt; line-height: 1.5; }
  .page { max-width: 190mm; margin: 0 auto; padding: 12mm 0; }
  .bar { background: #eef1f8; border-bottom: 1px solid #cfd5e3; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px; }
  .bar button { min-height: 48px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  h1 { font-size: 18pt; text-align: center; margin: 0 0 4mm; letter-spacing: 0.1em; }
  h2 { font-size: 12.5pt; margin: 6mm 0 2mm; border-left: 4px solid var(--navy); padding-left: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; font-size: 10pt; }
  th { background: #f0f2f6; white-space: nowrap; }
  .meta th { width: 26mm; }
  .item { border: 1px solid var(--line); margin-bottom: 4mm; break-inside: avoid; }
  .item .head { background: #f0f2f6; padding: 4px 8px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .item table td, .item table th { border-left: 0; border-right: 0; }
  .item .photos { display: flex; gap: 4mm; flex-wrap: wrap; padding: 0 6px; }
  .item figure { margin: 6px 0; }
  .item figcaption { font-size: 8.5pt; color: #4a4f5a; }
  .item img { max-width: 70mm; max-height: 55mm; border: 1px solid var(--line); display: block; }
  .stop { color: var(--g1); font-weight: 800; }
  .note { font-size: 9pt; color: #4a4f5a; margin-top: 6mm; border-top: 1px solid var(--line); padding-top: 3mm; }
  pre { white-space: pre-wrap; font-family: inherit; border: 1px solid var(--line); padding: 3mm; margin: 0; font-size: 10pt; }
  @media print {
    .bar { display: none; }
    .page { padding: 0; max-width: none; }
    @page { size: A4; margin: 14mm 12mm; }
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="print" type="button">인쇄 / PDF로 저장</button>
  <span>인쇄 창에서 대상(프린터)을 <b>"PDF로 저장"</b>으로 고르면 PDF 파일로 저장됩니다.</span>
</div>
<div class="page" id="page"><p>보고서를 만드는 중입니다…</p></div>
<script src="report.js"></script>
</body>
</html>
