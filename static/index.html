<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식자재 안전 지키미</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><img src="img/face.jpg" alt="">군 급식 식자재 안전 지키미<small>베타</small></div>
    <nav class="nav hidden" id="nav">
      <a href="#inspect" data-view="inspect">검수</a>
      <a href="#report" data-view="report">보고</a>
      <a href="#records" data-view="records">검수 기록</a>
      <a href="#settings" data-view="settings">설정</a>
    </nav>
    <div class="who hidden" id="who"></div>
  </div>
</header>

<section class="topart hidden" id="topart" aria-label="안내 그림">
  <div class="wrap topart-in">
    <img class="b-truck" src="img/truck.jpg" alt="식자재를 싣고 부대로 들어오는 납품 트럭 그림">
    <div class="b-text">
      <b>오늘 들어온 식자재, 한 번에 확인</b>
      <span>바코드 · 사진 · 직접 입력으로 회수·판매중지 대상을 찾아봅니다</span>
    </div>
    <img class="b-cat" src="img/inspector.jpg" alt="당근을 들고 검수표를 확인하는 고양이 급식 감독관 그림">
  </div>
</section>

<main class="wrap" id="main">
  <p class="muted">불러오는 중입니다…</p>
</main>

<script src="vendor/zxing.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
